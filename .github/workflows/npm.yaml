name: Publish npm package and GitHub release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thenamespace/ens-components' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Read committed version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/components/package.json').version")
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::This workflow publishes stable versions only."
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::Tag v$VERSION already exists. Choose a new version in a PR."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Build library, demo, and Storybook
        run: pnpm build

      - name: Check npm package
        run: pnpm check:package

      - name: Publish checked tarball to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: npm publish ".artifacts/thenamespace-ens-components-${VERSION}.tgz" --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/v${VERSION}" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes \
            --notes "[npm package](https://www.npmjs.com/package/@thenamespace/ens-components/v${VERSION}) · [Changelog](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/CHANGELOG.md)"
