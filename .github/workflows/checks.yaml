name: Package checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Format, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting of changed files
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || format('{0}^', github.sha) }}
        run: pnpm format:changed "$FORMAT_BASE"

      - name: Build library, demo, and Storybook
        run: pnpm build

      - name: Check npm package
        run: pnpm check:package

      - name: Save verified package for publishing
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: .artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
